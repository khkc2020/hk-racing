name: 🗄️ 賽後自動賽果歸檔與大數據累積

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # 1. 星期三跑馬地夜賽完場後 (週三 23:45 HKT -> UTC 15:45)
    - cron: "45 15 * * 3"
    # 2. 星期六 / 星期日日賽完場後 (週六、週日 19:30 HKT -> UTC 11:30)
    - cron: "30 11 * * 0,6"

jobs:
  archive-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 檢出代碼庫
        uses: actions/checkout@v4

      - name: 配置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝依賴套件
        run: |
          pip install --default-timeout=60 requests beautifulsoup4 supabase

      - name: 執行賽後賽果自動歸檔
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python archive_daily_results.py
