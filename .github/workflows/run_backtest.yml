name: 賽馬 AI 歷史大數據全息回測 (1,448+場)

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼庫
        uses: actions/checkout@v4

      - name: 配置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝核心套件
        run: |
          python -m pip install --upgrade pip
          pip install --default-timeout=100 requests beautifulsoup4 numpy supabase

      - name: 執行當前新模型 1,448+ 場全息回測
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python backtest_current_model.py
