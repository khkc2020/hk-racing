name: 賽馬 AI 排位自動預測引擎

on:
  schedule:
    # 賽前排位公佈定時運行 (週一、週四 12:30 HK)
    - cron: "30 4 * * 1,4"
  # 支援隨時手動點擊「Run workflow」執行
  workflow_dispatch:

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼庫
        uses: actions/checkout@v4

      - name: 配置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝核心套件
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas numpy supabase lightgbm scikit-learn selenium webdriver-manager

      - name: 執行 AI 排位排序與配備分析
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python predict_upcoming.py
