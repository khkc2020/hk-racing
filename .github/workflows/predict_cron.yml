name: 賽馬 AI 排位自動預測引擎

on:
  schedule:
    # 1. 賽前排位公佈 (週一、週四 12:30 HKT -> UTC 04:30)
    - cron: "30 4 * * 1,4"
    
    # 2. 馬會官方開盤初盤 (週二、週五 14:00 HKT -> UTC 06:00)
    - cron: "0 6 * * 2,5"
    
    # 3. 隔夜大額定型盤 (週二、週五 21:00 HKT -> UTC 13:00)
    - cron: "0 13 * * 2,5"
    
    # 4. 夜馬賽日賽前即時盤 (週三 17:30 HKT -> UTC 09:30)
    - cron: "30 9 * * 3"
    
    # 5. 日馬賽日賽前即時盤 (週六、週日 11:00 HKT -> UTC 03:00)
    - cron: "0 3 * * 0,6"

  workflow_dispatch:

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼庫
        uses: actions/checkout@v4

      - name: 配置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝核心套件 (極速輕量化，防網絡超時)
        run: |
          python -m pip install --upgrade pip
          pip install --default-timeout=100 requests beautifulsoup4 numpy supabase selenium webdriver-manager

      - name: 執行 AI 排位排序與配備分析
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python predict_upcoming.py
