name: HK Racing Auto Pipeline

on:
  schedule:
    # 香港時間每逢星期三夜賽 (23:30) 執行: 15:30 UTC
    - cron: '30 15 * * 3'
    # 香港時間每逢星期六、日賽 (18:30) 執行: 10:30 UTC
    - cron: '30 10 * * 0,6'
  # 支援手動點擊按鈕隨時立即執行
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 下載倉庫代碼
        uses: actions/checkout@v4

      - name: 設置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行賽馬數據採集與 AI 預測
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python pipeline.py
