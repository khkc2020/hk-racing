name: ⚡ 賽馬 AI 臨場秒級賠率與聰明錢同步 (高頻率自適應)

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

  schedule:
    # ==========================================
    # A. 星期三跑馬地夜賽 (通常 18:30 / 19:15 開跑)
    # ==========================================
    # 1. 賽前一日下午 3 點 (15:00 HKT) 至晚上 23:00，每 4 小時一次 (UTC 07:00, 11:00, 15:00)
    - cron: "0 7,11,15 * * 2"
    # 2. 賽日早段至下午 17:30，每 4 小時一次 (UTC 01:00, 05:00, 09:00)
    - cron: "0 1,5,9 * * 3"
    # 3. 臨場決戰期：由開賽前半小時 (18:00 HKT / UTC 10:00) 開始，每 5 分鐘一次，至 23:00 完場
    - cron: "*/5 10,11,12,13,14,15 * * 3"

    # ==========================================
    # B. 星期六 / 星期日沙田或跑馬地日賽 (通常 12:30 / 13:00 開跑)
    # ==========================================
    # 1. 賽前一日下午 3 點 (15:00 HKT) 至晚上，每 4 小時一次 (UTC 07:00, 11:00, 15:00)
    - cron: "0 7,11,15 * * 5,6"
    # 2. 賽日早段 (12:00 HKT 前)，每 4 小時一次 (UTC 00:00, 04:00)
    - cron: "0 0,4 * * 0,6"
    # 3. 臨場決戰期：由開賽前半小時 (12:00 HKT / UTC 04:00) 開始，每 5 分鐘一次，至 18:00 完場
    - cron: "*/5 4,5,6,7,8,9,10 * * 0,6"

jobs:
  fast-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 檢出代碼庫
        uses: actions/checkout@v4

      - name: 配置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝輕量套件
        run: |
          pip install --default-timeout=60 requests beautifulsoup4 numpy supabase selenium webdriver-manager

      - name: 執行高頻賠率與 AI 賽道偏差同步
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python sync_odds_live.py
